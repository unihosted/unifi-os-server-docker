# Network App bypass — proxies port 7443 directly to the UniFi Network
# Application (127.0.0.1:8081), skipping UOS SSO.
#
#   *** NOT FOR PRODUCTION — DO NOT EXPOSE PUBLICLY ***
#
# This circumvents SSO authentication.  Bind to localhost only.
# Copied into place by uos-entrypoint.sh via the unifi-core pre-start hook.

server {
    listen 7443 ssl http2;
    listen [::]:7443 ssl http2;
    server_name _;

    include /data/unifi-core/config/http/local-certs.conf;

    location / {
        proxy_pass http://127.0.0.1:8081/;
        proxy_redirect http://127.0.0.1/ https://$host:7443/;
        proxy_redirect http://$host/ https://$host:7443/;
        proxy_set_header Host $host:7443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 7443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-UI-Connection-Type local;
    }
}
