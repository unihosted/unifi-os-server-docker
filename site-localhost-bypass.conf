# Localhost bypass - port 7443 directly to Network Controller (port 8081)
# Bypasses UOS SSO for direct API access from localhost
#
# Kept in sync at /data/unifi-core/config/http/site-localhost-bypass.conf
# by the background watcher in uos-entrypoint.sh

server {
    listen 127.0.0.1:7443 ssl http2;
    listen [::1]:7443 ssl http2;
    server_name _;

    include /data/unifi-core/config/http/local-certs.conf;

    location / {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-UI-Connection-Type local;
    }
}
