services:
  unifi-os-server:
    container_name: unifi-os-server
    image: ghcr.io/unihosted/unifi-os-server-docker:latest
    platform: linux/amd64
    privileged: true
    cgroup: host
    restart: unless-stopped
    pull_policy: always
    networks:
      - unifi-os
    ports:
      # STUN service
      - "3478:3478/udp"
      # Syslog
      - "5514:5514/udp"
      # HTTPS Web UI
      - "11443:443"
      # Localhost API bypass (bypasses SSO)
      - "127.0.0.1:7443:7443"
      # PostgreSQL (optional external access)
      - "127.0.0.1:5432:5432"
      # Speed test
      - "6789:6789"
      # HTTP redirect
      - "8080:8080"
      # HTTP portal
      - "8880:8880"
      # API
      - "11084:11084"
    volumes:
      - ./volume:/var/lib/uosserver
      - ./volume:/var/lib/unifi
    tmpfs:
      - /run:exec
      - /run/lock
    depends_on:
      - unifi-os-server-mongodb
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      # REQUIRED: Set your server's public IP in .env file
      UOS_SYSTEM_IP: ${UOS_SYSTEM_IP:?UOS_SYSTEM_IP is required. See .env.example}
      # Optional: Set a specific UUID
      # UOS_UUID: ${UOS_UUID:-}
      # MongoDB connection settings
      MONGO_HOST: ${MONGO_HOST:-unifi-os-server-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
      MONGO_USER: ${MONGO_USER:-root}
      MONGO_PASS: ${MONGO_PASS:-root}
      MONGO_TLS: ${MONGO_TLS:-false}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-admin}
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:443/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  unifi-os-server-mongodb:
    container_name: unifi-os-server-mongodb
    image: mongo:4.4
    restart: unless-stopped
    networks:
      - unifi-os
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-root}
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  mongodb-data:
    driver: local

networks:
  unifi-os:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
