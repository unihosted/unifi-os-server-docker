services:
  unifi-os-server:
    container_name: unifi-os-server
    image: ghcr.io/unihosted/unifi-os-server:5.0.6
    platform: linux/amd64
    privileged: true
    cgroup: host
    restart: unless-stopped
    pull_policy: always
    networks:
      - unifi-os
    ports:
      - "3478:3478/udp"
      - "5514:5514/udp"
      - "11443:443"
      - "127.0.0.1:7443:7443"
      - "127.0.0.1:5432:5432"
      - "6789:6789"
      - "8080:8080"
      - "8880:8880"
      - "11084:11084"
    volumes:
      - ./volume:/var/lib/uosserver
      - ./volume:/var/lib/unifi
    tmpfs:
      - /run:exec
      - /run/lock
    depends_on:
      - unifi-network-mongodb
    environment:
      TZ: Europe/Amsterdam
      UOS_SYSTEM_IP: "91.98.78.106"
      MONGO_HOST: unifi-os-server-mongodb
      MONGO_PORT: "27017"
      MONGO_USER: root
      MONGO_PASS: root

  unifi-network-mongodb:
    container_name: unifi-os-server-mongodb
    image: mongo:4.4
    restart: unless-stopped
    networks:
      - unifi-os
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"

volumes:
  mongodb-data:

networks:
  unifi-os:
