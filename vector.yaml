sources:
  docker:
    type: docker_logs
    include_containers:
      - unifi-os-server

transforms:
  parse:
    type: remap
    inputs:
      - docker
    source: |-
      .raw = del(.message)

      # [uos-entrypoint][2026-04-16T15:48:15+02:00] Some message
      entrypoint = parse_regex(.raw, r'^\[(?P<unit>[^\]]+)\]\[(?P<timestamp>[^\]]+)\]\s+(?P<message>.*)$') ?? {}
      if exists(entrypoint.unit) {
        .unit = entrypoint.unit
        .message = entrypoint.message
        .timestamp = parse_timestamp!(entrypoint.timestamp, "%+")
      } else {
        # Apr 16 15:50:28 sudo[1157]:  root : PWD=...
        journal = parse_regex(.raw, r'^(?P<ts>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?P<unit>[^\[]+)\[(?P<pid>\d+)\]:\s*(?P<message>.*)$') ?? {}
        if exists(journal.unit) {
          .unit = journal.unit
          .pid = to_int!(journal.pid)
          .message = journal.message
          ts_str = format_timestamp!(now(), "%Y") + " " + string!(journal.ts)
          .timestamp = parse_timestamp(ts_str, "%Y %b %d %H:%M:%S") ?? now()
        } else {
          .message = .raw
        }
      }

      del(.raw)
      del(.source_type)
      del(.stream)
      del(.container_id)
      del(.container_name)
      del(.label)
      del(.image)
      del(.container_created_at)

sinks:
  console:
    type: console
    inputs:
      - parse
    encoding:
      codec: json
