name: Extract UniFi OS Server base image and build Docker image

on:
  workflow_dispatch:
    inputs:
      installer_url:
        description: "Direct fw-download.ubnt.com URL to the UniFi OS Server Linux installer"
        required: true
        default: "https://fw-download.ubnt.com/data/unifi-os-server/1856-linux-x64-5.0.6-33f4990f-6c68-4e72-9d9c-477496c22450.6-x64"
      uos_server_version:
        description: "UniFi OS Server version (for tagging)"
        required: true
        default: "5.0.6"
      firmware_platform:
        description: "Value written to /usr/lib/platform by entrypoint"
        required: true
        default: "linux-x64"
      image_name:
        description: "Final image name (without registry). Example: unifi-os-server-docker"
        required: true
        default: "unifi-os-server-docker"
      push:
        description: "Push to GHCR (true/false)"
        required: true
        default: "true"

  push:
    branches: ["main"]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
    paths:
      - "Dockerfile"
      - "uos-entrypoint.sh"
      - ".github/workflows/extract-image.yml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          # Extract version from git tag if triggered by tag push
          GIT_TAG="${GITHUB_REF#refs/tags/v}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "Triggered by git tag: ${GITHUB_REF}"
            UOS_SERVER_VERSION_FROM_TAG="${GIT_TAG}"
          else
            UOS_SERVER_VERSION_FROM_TAG=""
          fi

          # workflow_dispatch inputs are empty on non-workflow_dispatch triggers, so set defaults.
          INSTALLER_URL="${{ inputs.installer_url || '' }}"
          # Default installer URL for version 5.0.6
          DEFAULT_URL="https://fw-download.ubnt.com/data/unifi-os-server/1856-linux-x64-5.0.6-33f4990f-6c68-4e72-9d9c-477496c22450.6-x64"
          [[ -n "$INSTALLER_URL" ]] || INSTALLER_URL="$DEFAULT_URL"

          # Use version from git tag if available, otherwise from inputs, otherwise default
          UOS_SERVER_VERSION="${{ inputs.uos_server_version || '' }}"
          [[ -n "$UOS_SERVER_VERSION" ]] || UOS_SERVER_VERSION="${UOS_SERVER_VERSION_FROM_TAG:-5.0.6}"

          FIRMWARE_PLATFORM="${{ inputs.firmware_platform || 'linux-x64' }}"
          IMAGE_NAME="${{ inputs.image_name || 'unifi-os-server-docker'}}"
          PUSH="${{ inputs.push || 'true' }}"

          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${IMAGE_NAME}"
          GHCR_BASE_IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${IMAGE_NAME}-base"

          echo "installer_url=$INSTALLER_URL" >> "$GITHUB_OUTPUT"
          echo "uos_server_version=$UOS_SERVER_VERSION" >> "$GITHUB_OUTPUT"
          echo "firmware_platform=$FIRMWARE_PLATFORM" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=$GHCR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ghcr_base_image=$GHCR_BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "is_tag_push=$([[ -n \"$UOS_SERVER_VERSION_FROM_TAG\" ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (binwalk + skopeo)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binwalk \
            skopeo \
            jq \
            p7zip-full \
            tar \
            xz-utils \
            gzip \
            ca-certificates

      - name: Download UniFi OS Server installer binary
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.vars.outputs.installer_url }}"
          echo "Downloading: $url"
          curl -fL --retry 5 --retry-delay 2 -o uos-installer.bin "$url"
          chmod +x uos-installer.bin
          ls -lah uos-installer.bin

      - name: Extract embedded image.tar with binwalk
        shell: bash
        run: |
          set -euo pipefail

          # Needs root for extraction in many environments.
          sudo binwalk --run-as=root -e uos-installer.bin

          IMAGE_TAR="$(find . -type f -name 'image.tar' | head -n 1 || true)"
          if [[ -z "${IMAGE_TAR}" ]]; then
            echo "ERROR: image.tar not found after binwalk extraction."
            find . -maxdepth 4 -type d -print
            exit 1
          fi

          echo "Found image.tar at: ${IMAGE_TAR}"
          echo "IMAGE_TAR=${IMAGE_TAR}" >> "$GITHUB_ENV"

      - name: Convert extracted OCI image.tar -> docker-archive (no podman)
        shell: bash
        run: |
          set -euo pipefail

          rm -rf oci
          mkdir -p oci
          tar -xf "${IMAGE_TAR}" -C oci

          # Convert OCI layout -> docker archive, tagging inside the archive as uosserver:base
          skopeo copy \
            oci:oci \
            docker-archive:base-docker.tar:uosserver:base

          ls -lah base-docker.tar

      - name: Load base image into Docker
        shell: bash
        run: |
          set -euo pipefail
          docker load -i base-docker.tar
          # Ensure the tag exists as expected
          docker image inspect uosserver:base >/dev/null
          docker images | head

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push base image to GHCR
        if: steps.vars.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail

          GHCR_BASE_IMAGE="${{ steps.vars.outputs.ghcr_base_image }}"
          UOS_SERVER_VERSION="${{ steps.vars.outputs.uos_server_version }}"

          docker tag uosserver:base "${GHCR_BASE_IMAGE}:${UOS_SERVER_VERSION}"
          docker tag uosserver:base "${GHCR_BASE_IMAGE}:latest"
          docker push "${GHCR_BASE_IMAGE}:${UOS_SERVER_VERSION}"
          docker push "${GHCR_BASE_IMAGE}:latest"

      - name: Build (and optionally push) final image
        shell: bash
        run: |
          set -euo pipefail

          GHCR_IMAGE="${{ steps.vars.outputs.ghcr_image }}"
          UOS_SERVER_VERSION="${{ steps.vars.outputs.uos_server_version }}"
          FIRMWARE_PLATFORM="${{ steps.vars.outputs.firmware_platform }}"
          IS_TAG_PUSH="${{ steps.vars.outputs.is_tag_push }}"

          # Parse version components for semantic tagging
          MAJOR=$(echo "$UOS_SERVER_VERSION" | cut -d. -f1)
          MINOR=$(echo "$UOS_SERVER_VERSION" | cut -d. -f2)
          PATCH=$(echo "$UOS_SERVER_VERSION" | cut -d. -f3 | cut -d- -f1)
          IS_PRERELEASE=$([[ "$UOS_SERVER_VERSION" == *-* ]] && echo "true" || echo "false")

          # Build tags list
          TAGS="-t ${GHCR_IMAGE}:${UOS_SERVER_VERSION}"

          # Only add semantic tags on git tag pushes (not manual runs or main branch pushes)
          if [[ "$IS_TAG_PUSH" == "true" ]]; then
            TAGS="${TAGS} -t ${GHCR_IMAGE}:${MAJOR}.${MINOR}"
            TAGS="${TAGS} -t ${GHCR_IMAGE}:${MAJOR}"
            # Only tag 'latest' on non-prerelease versions
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              TAGS="${TAGS} -t ${GHCR_IMAGE}:latest"
            fi
          fi

          echo "Building with tags:"
          echo "$TAGS" | tr ' ' '\n' | grep -v '^-t$' || true

          docker build \
              --build-arg UOS_SERVER_VERSION="${UOS_SERVER_VERSION}" \
              --build-arg FIRMWARE_PLATFORM="${FIRMWARE_PLATFORM}" \
              $TAGS \
              .

          if [[ "${{ steps.vars.outputs.push }}" == "true" ]]; then
            # Push all tags
            docker push "${GHCR_IMAGE}:${UOS_SERVER_VERSION}"
            if [[ "$IS_TAG_PUSH" == "true" ]]; then
              docker push "${GHCR_IMAGE}:${MAJOR}.${MINOR}"
              docker push "${GHCR_IMAGE}:${MAJOR}"
              if [[ "$IS_PRERELEASE" == "false" ]]; then
                docker push "${GHCR_IMAGE}:latest"
              fi
            fi
          fi

          echo ""
          echo "Published images:"
          echo "  ${GHCR_IMAGE}:${UOS_SERVER_VERSION}"
          if [[ "$IS_TAG_PUSH" == "true" ]]; then
            echo "  ${GHCR_IMAGE}:${MAJOR}.${MINOR}"
            echo "  ${GHCR_IMAGE}:${MAJOR}"
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              echo "  ${GHCR_IMAGE}:latest"
            fi
          fi

      - name: Summary
        shell: bash
        run: |
          echo "Base image: ${{ steps.vars.outputs.ghcr_base_image }}:${{ steps.vars.outputs.uos_server_version }}"
          echo "Final image: ${{ steps.vars.outputs.ghcr_image }}:${{ steps.vars.outputs.uos_server_version }}"
          echo "Push: ${{ steps.vars.outputs.push }}"
          echo "Is tag push: ${{ steps.vars.outputs.is_tag_push }}"

      - name: Create GitHub Release
        if: steps.vars.outputs.is_tag_push == 'true'
        uses: softprops/action-gh-release@v1
        with:
          name: "Release v${{ steps.vars.outputs.uos_server_version }}"
          body: |
            ## Docker Images

            ```bash
            docker pull ${{ steps.vars.outputs.ghcr_image }}:${{ steps.vars.outputs.uos_server_version }}
            ```

            ### Available Tags
            - `${{ steps.vars.outputs.uos_server_version }}` - This specific version
            - `<major>.<minor>` (e.g., `5.0`) - Latest patch in this minor version
            - `<major>` (e.g., `5`) - Latest in this major version
            - `latest` - Latest stable release (non-prerelease only)

            ## Quick Start

            ```bash
            docker run -d \\
              --name unifi-os-server \\
              --privileged \\
              -p 11443:443 \\
              -e UOS_SYSTEM_IP=your.ip.address \\
              ${{ steps.vars.outputs.ghcr_image }}:${{ steps.vars.outputs.uos_server_version }}
            ```

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          generate_release_notes: true
