name: Extract UniFi OS Server base image and build Docker image

on:
  workflow_dispatch:
    inputs:
      installer_url:
        description: "Direct fw-download.ubnt.com URL to the UniFi OS Server Linux installer"
        required: true
        default: "https://fw-download.ubnt.com/data/unifi-os-server/1856-linux-x64-5.0.6-33f4990f-6c68-4e72-9d9c-477496c22450.6-x64"
      uos_server_version:
        description: "UniFi OS Server version (for tagging)"
        required: true
        default: "5.0.6"
      firmware_platform:
        description: "Value written to /usr/lib/platform by entrypoint"
        required: true
        default: "linux-x64"
      image_name:
        description: "Final image name (without registry). Example: unifi-os-server-docker"
        required: true
        default: "unifi-os-server-docker"
      push:
        description: "Push to GHCR (true/false)"
        required: true
        default: "true"

  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "uos-entrypoint.sh"
      - "site-localhost-bypass.conf"
      - ".github/workflows/extract-image.yml"
      - "versions/**/Dockerfile"
      - "versions/**/uos-entrypoint.sh"
      - "versions/**/site-localhost-bypass.conf"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Determine which versions to build
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine versions to build
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          # If triggered by a tag (e.g., v5.0.6), extract version from tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Tag trigger detected: building version $TAG_VERSION"
            VERSIONS="[$TAG_VERSION]"
          # If triggered by push to main, detect all available versions in versions/
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Push trigger detected, scanning versions directory..."
            VERSIONS_LIST=()
            # Find all version directories that have a Dockerfile
            for version_dir in versions/*/; do
              if [[ -f "${version_dir}Dockerfile" ]]; then
                version=$(basename "$version_dir")
                VERSIONS_LIST+=("$version")
              fi
            done

            if [ ${#VERSIONS_LIST[@]} -gt 0 ]; then
              # Build JSON array of all versions
              VERSIONS_JSON=$(printf '%s\n' "${VERSIONS_LIST[@]}" | jq -R . | jq -s .)
              VERSIONS="$VERSIONS_JSON"
            else
              # No versions directory, use default
              VERSIONS='["5.0.6"]'
            fi
          else
            # workflow_dispatch or other triggers - use input version
            INPUT_VERSION="${{ inputs.uos_server_version || '5.0.6' }}"
            VERSIONS="[$INPUT_VERSION]"
          fi

          echo "versions=$VERSIONS"
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.versions) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables for version ${{ matrix.version }}
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ matrix.version }}"

          # workflow_dispatch inputs may be empty on push/tag triggers, so set defaults
          INSTALLER_URL="${{ inputs.installer_url || '' }}"
          # Map known versions to their default URLs (can be overridden via input)
          declare -A VERSION_URLS=(
            ["4.3.6"]="https://fw-download.ubnt.com/data/unifi-os-server/2f3a-linux-x64-4.3.6-be3b4ae0-6bcd-435d-b893-e93da668b9d0.6-x64"
            ["5.0.6"]="https://fw-download.ubnt.com/data/unifi-os-server/1856-linux-x64-5.0.6-33f4990f-6c68-4e72-9d9c-477496c22450.6-x64"
          )
          if [[ -z "$INSTALLER_URL" && -n "${VERSION_URLS[$VERSION]:-}" ]]; then
            INSTALLER_URL="${VERSION_URLS[$VERSION]}"
          fi
          # Fallback if still empty
          [[ -n "$INSTALLER_URL" ]] || INSTALLER_URL="https://fw-download.ubnt.com/data/unifi-os-server/1856-linux-x64-5.0.6-33f4990f-6c68-4e72-9d9c-477496c22450.6-x64"

          FIRMWARE_PLATFORM="${{ inputs.firmware_platform || 'linux-x64' }}"
          IMAGE_NAME="${{ inputs.image_name || 'unifi-os-server-docker'}}"
          PUSH="${{ inputs.push || 'true' }}"

          # Determine build context - use version directory if it exists
          if [[ -f "versions/$VERSION/Dockerfile" ]]; then
            BUILD_CONTEXT="versions/$VERSION"
            DOCKERFILE="versions/$VERSION/Dockerfile"
            echo "Using version-specific build context: $BUILD_CONTEXT"
          else
            BUILD_CONTEXT="."
            DOCKERFILE="Dockerfile"
            echo "Using default build context (root)"
          fi

          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${IMAGE_NAME}"
          GHCR_BASE_IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${IMAGE_NAME}-base"

          echo "installer_url=$INSTALLER_URL" >> "$GITHUB_OUTPUT"
          echo "uos_server_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "firmware_platform=$FIRMWARE_PLATFORM" >> "$GITHUB_OUTPUT"
          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=$GHCR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "ghcr_base_image=$GHCR_BASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "build_context=$BUILD_CONTEXT" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (binwalk + skopeo)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binwalk \
            skopeo \
            jq \
            p7zip-full \
            tar \
            xz-utils \
            gzip \
            ca-certificates

      - name: Download UniFi OS Server installer binary
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.vars.outputs.installer_url }}"
          echo "Downloading: $url"
          curl -fL --retry 5 --retry-delay 2 -o uos-installer.bin "$url"
          chmod +x uos-installer.bin
          ls -lah uos-installer.bin

      - name: Extract embedded image.tar with binwalk
        shell: bash
        run: |
          set -euo pipefail

          # Needs root for extraction in many environments.
          sudo binwalk --run-as=root -e uos-installer.bin

          IMAGE_TAR="$(find . -type f -name 'image.tar' | head -n 1 || true)"
          if [[ -z "${IMAGE_TAR}" ]]; then
            echo "ERROR: image.tar not found after binwalk extraction."
            find . -maxdepth 4 -type d -print
            exit 1
          fi

          echo "Found image.tar at: ${IMAGE_TAR}"
          echo "IMAGE_TAR=${IMAGE_TAR}" >> "$GITHUB_ENV"

      - name: Convert extracted OCI image.tar -> docker-archive (no podman)
        shell: bash
        run: |
          set -euo pipefail

          rm -rf oci
          mkdir -p oci
          tar -xf "${IMAGE_TAR}" -C oci

          # Convert OCI layout -> docker archive, tagging inside the archive as uosserver:base
          skopeo copy \
            oci:oci \
            docker-archive:base-docker.tar:uosserver:base

          ls -lah base-docker.tar

      - name: Load base image into Docker
        shell: bash
        run: |
          set -euo pipefail
          docker load -i base-docker.tar
          # Ensure the tag exists as expected
          docker image inspect uosserver:base >/dev/null
          docker images | head

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push base image to GHCR
        if: steps.vars.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail

          GHCR_BASE_IMAGE="${{ steps.vars.outputs.ghcr_base_image }}"
          UOS_SERVER_VERSION="${{ steps.vars.outputs.uos_server_version }}"

          docker tag uosserver:base "${GHCR_BASE_IMAGE}:${UOS_SERVER_VERSION}"
          docker tag uosserver:base "${GHCR_BASE_IMAGE}:latest"
          docker push "${GHCR_BASE_IMAGE}:${UOS_SERVER_VERSION}"
          docker push "${GHCR_BASE_IMAGE}:latest"

      - name: Build (and optionally push) final image
        shell: bash
        run: |
          set -euo pipefail

          GHCR_IMAGE="${{ steps.vars.outputs.ghcr_image }}"
          UOS_SERVER_VERSION="${{ steps.vars.outputs.uos_server_version }}"
          FIRMWARE_PLATFORM="${{ steps.vars.outputs.firmware_platform }}"
          BUILD_CONTEXT="${{ steps.vars.outputs.build_context }}"
          DOCKERFILE="${{ steps.vars.outputs.dockerfile }}"

          TAG1="${GHCR_IMAGE}:${UOS_SERVER_VERSION}"
          TAG2="${GHCR_IMAGE}:latest"

          docker build \
              --build-arg UOS_SERVER_VERSION="${UOS_SERVER_VERSION}" \
              --build-arg FIRMWARE_PLATFORM="${FIRMWARE_PLATFORM}" \
              -f "${DOCKERFILE}" \
              -t "${TAG1}" \
              -t "${TAG2}" \
              "${BUILD_CONTEXT}"

          if [[ "${{ steps.vars.outputs.push }}" == "true" ]]; then
              docker push "${TAG1}"
              docker push "${TAG2}"
          fi

      - name: Summary
        shell: bash
        run: |
          echo "Version: ${{ matrix.version }}"
          echo "Base image: ${{ steps.vars.outputs.ghcr_base_image }}:${{ steps.vars.outputs.uos_server_version }}"
          echo "Final image: ${{ steps.vars.outputs.ghcr_image }}:${{ steps.vars.outputs.uos_server_version }}"
          echo "Build context: ${{ steps.vars.outputs.build_context }}"
          echo "Push: ${{ steps.vars.outputs.push }}"
