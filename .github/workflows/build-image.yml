name: Build and publish UniFi OS Server Docker image

on:
  workflow_dispatch:
    inputs:
      installer_url_amd64:
        description: "fw-download.ubnt.com URL for the linux-x64 installer"
        required: false
        default: ""
      installer_url_arm64:
        description: "fw-download.ubnt.com URL for the linux-arm64 installer"
        required: false
        default: ""
      uos_server_version:
        description: "UniFi OS Server version (for tagging)"
        required: true
        default: "5.0.6"
      image_name:
        description: "Final image name (without registry). Example: unifi-os-server-docker"
        required: true
        default: "unifi-os-server-docker"
      push:
        description: "Push to GHCR (true/false)"
        required: true
        default: "true"

  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set-matrix.outputs.include }}
    steps:
      - name: Build platform matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.uos_server_version || '5.0.6' }}"
          fi

          declare -A VERSION_URLS_AMD64=(
            ["4.3.6"]="https://fw-download.ubnt.com/data/unifi-os-server/2f3a-linux-x64-4.3.6-be3b4ae0-6bcd-435d-b893-e93da668b9d0.6-x64"
            ["5.0.6"]="https://fw-download.ubnt.com/data/unifi-os-server/1856-linux-x64-5.0.6-33f4990f-6c68-4e72-9d9c-477496c22450.6-x64"
            ["5.1.15"]="https://fw-download.ubnt.com/data/unifi-os-server/24e0-linux-x64-5.1.15-926621de-c9d7-48cd-8921-a0ff3eebd3f4.15-x64"
            ["5.1.19"]="https://fw-download.ubnt.com/data/unifi-os-server/b828-linux-x64-5.1.19-e38d0b0e-b462-403d-9861-f57f25772106.19-x64"
            ["5.1.21"]="https://fw-download.ubnt.com/data/unifi-os-server/f5e2-linux-x64-5.1.21-a400c9c6-8328-4634-b223-ebfcf742720a.21-x64"
          )
          declare -A VERSION_URLS_ARM64=(
            ["5.0.6"]="https://fw-download.ubnt.com/data/unifi-os-server/df5b-linux-arm64-5.0.6-f35e944c-f4b6-4190-93a8-be61b96c58f4.6-arm64"
            ["5.1.15"]="https://fw-download.ubnt.com/data/unifi-os-server/adc4-linux-arm64-5.1.15-53ab1f2c-4cd5-4a5f-b750-d1aa35679b4f.15-arm64"
            ["5.1.19"]="https://fw-download.ubnt.com/data/unifi-os-server/e027-linux-arm64-5.1.19-ebdd998e-306a-4880-af41-2bdc50e91e70.19-arm64"
            ["5.1.21"]="https://fw-download.ubnt.com/data/unifi-os-server/162a-linux-arm64-5.1.21-c2775845-975c-453d-88f4-f9061329b27e.21-arm64"
          )

          URL_AMD64="${{ inputs.installer_url_amd64 || '' }}"
          URL_ARM64="${{ inputs.installer_url_arm64 || '' }}"
          [[ -n "$URL_AMD64" ]] || URL_AMD64="${VERSION_URLS_AMD64[$VERSION]:-}"
          [[ -n "$URL_ARM64" ]] || URL_ARM64="${VERSION_URLS_ARM64[$VERSION]:-}"

          INCLUDES="[]"
          if [[ -n "$URL_AMD64" ]]; then
            INCLUDES=$(echo "$INCLUDES" | jq -c --arg v "$VERSION" --arg u "$URL_AMD64" \
              '. + [{"version": $v, "platform": "linux/amd64", "arch_suffix": "amd64", "installer_url": $u}]')
          fi
          if [[ -n "$URL_ARM64" ]]; then
            INCLUDES=$(echo "$INCLUDES" | jq -c --arg v "$VERSION" --arg u "$URL_ARM64" \
              '. + [{"version": $v, "platform": "linux/arm64", "arch_suffix": "arm64", "installer_url": $u}]')
          fi

          echo "include=$INCLUDES" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION for: $(echo "$INCLUDES" | jq -r '.[].platform' | tr '\n' ' ')"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ inputs.image_name || 'unifi-os-server-docker' }}"
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${IMAGE_NAME}"
          PUSH="${{ inputs.push || 'true' }}"

          echo "ghcr_image=$GHCR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.vars.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ steps.vars.outputs.push == 'true' }}
          tags: |
            ${{ steps.vars.outputs.ghcr_image }}:${{ matrix.version }}-${{ matrix.arch_suffix }}
          build-args: |
            INSTALLER_URL_AMD64=${{ matrix.installer_url }}
            INSTALLER_URL_ARM64=${{ matrix.installer_url }}
            UOS_SERVER_VERSION=${{ matrix.version }}
          provenance: false

  manifest:
    needs: [matrix, build]
    runs-on: ubuntu-latest
    if: ${{ inputs.push != 'false' }}
    steps:
      - name: Set variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ inputs.image_name || 'unifi-os-server-docker' }}"
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_image=${{ env.REGISTRY }}/${OWNER_LC}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.vars.outputs.ghcr_image }}"
          INCLUDE='${{ needs.matrix.outputs.include }}'

          VERSIONS=$(echo "$INCLUDE" | jq -r '.[].version' | sort -u)
          for VERSION in $VERSIONS; do
            SOURCES=$(echo "$INCLUDE" | jq -r --arg v "$VERSION" \
              '.[] | select(.version == $v) | .arch_suffix' | \
              xargs -I{} echo "${IMAGE}:${VERSION}-{}")

            echo "Creating manifest ${IMAGE}:${VERSION} from:"
            echo "$SOURCES"

            docker buildx imagetools create \
              -t "${IMAGE}:${VERSION}" \
              -t "${IMAGE}:latest" \
              $SOURCES
          done

      - name: Summary
        shell: bash
        run: |
          IMAGE="${{ steps.vars.outputs.ghcr_image }}"
          INCLUDE='${{ needs.matrix.outputs.include }}'
          VERSION=$(echo "$INCLUDE" | jq -r '.[0].version')
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: $(echo "$INCLUDE" | jq -r '.[].platform' | tr '\n' ', ')" >> "$GITHUB_STEP_SUMMARY"
