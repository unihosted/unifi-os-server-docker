name: Test log forwarding

on:
  pull_request:
    paths:
      - 'uos-*.sh'
      - 'uos-*.cjs'
      - 'tests/**'
      - 'Dockerfile'
      - '.github/workflows/test-logs.yml'
      - '.github/workflows/build-image.yml'
  push:
    branches: [main]
    paths:
      - 'uos-*.sh'
      - 'uos-*.cjs'
      - 'tests/**'
      - 'Dockerfile'
      - '.github/workflows/test-logs.yml'
      - '.github/workflows/build-image.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bash -n uos-entrypoint.sh tests/image-smoke.sh
      - run: python3 tests/build-workflow.test.py
      - run: node --test tests/*.test.cjs
