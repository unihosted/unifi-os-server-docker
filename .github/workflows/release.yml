name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Extract version info from tag
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      major: ${{ steps.get_version.outputs.major }}
      minor: ${{ steps.get_version.outputs.minor }}
      patch: ${{ steps.get_version.outputs.patch }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      image_name: ${{ steps.get_image.outputs.image_name }}
    steps:
      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo $VERSION | cut -d. -f2)" >> $GITHUB_OUTPUT
          echo "patch=$(echo $VERSION | cut -d. -f3 | cut -d- -f1)" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Version: $VERSION"

      - name: Get image name
        id: get_image
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=${{ env.REGISTRY }}/${OWNER_LC}/unifi-os-server-docker" >> $GITHUB_OUTPUT

  # Build and push multi-tag image
  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            ${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.major }}
            ${{ !contains(needs.version.outputs.version, '-') && format('{0}:latest', needs.version.outputs.image_name) || '' }}
          build-args: |
            UOS_SERVER_VERSION=${{ needs.version.outputs.version }}
            FIRMWARE_PLATFORM=linux-x64

      - name: Image digest
        run: |
          echo "Published images:"
          echo "  ${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.version }}"
          echo "  ${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}"
          echo "  ${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.major }}"
          ${{ !contains(needs.version.outputs.version, '-') && format('echo "  {0}:latest"', needs.version.outputs.image_name) || '' }}

  # Create GitHub release
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"

          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "### Changes since $PREV_TAG" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            git log --pretty=format:"- %s (%h)" --no-merges "$PREV_TAG"..HEAD >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changes<<EOF" >> $GITHUB_OUTPUT
            echo "### Initial Release" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "This is the first release of unifi-os-server-docker." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Release v${{ needs.version.outputs.version }}"
          body: |
            ## Docker Images

            ```bash
            docker pull ${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.version }}
            ```

            ### Available Tags
            - `${{ needs.version.outputs.version }}` - This specific version
            - `${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}` - Latest ${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}.x
            - `${{ needs.version.outputs.major }}` - Latest ${{ needs.version.outputs.major }}.x
            ${{ !contains(needs.version.outputs.version, '-') && format('- `latest` - Latest stable release') || '' }}

            ${{ steps.release_notes.outputs.changes }}

            ## Quick Start

            ```bash
            # Using docker run
            docker run -d \\
              --name unifi-os-server \\
              --privileged \\
              -p 11443:443 \\
              -p 7443:7443 \\
              -e UOS_SYSTEM_IP=your.ip.address \\
              ${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.version }}
            ```

            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
          prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
